<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Familia CBD · Catálogo</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --fondo:#06100b;
  --tarjeta:#0d1c13;
  --tarjeta2:#12251a;
  --verde:#39e56f;
  --verde2:#20c95a;
  --texto:#ffffff;
  --gris:#9aaa9f;
  --borde:#24412f;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%, #1a4228 0%, #06100b 42%);
  color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  padding-bottom:100px;
}

/* CABECERA */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:17px 18px;
  background:rgba(6,16,11,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--borde);
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:.3px;
}

.logo span{
  color:var(--verde);
}

/* PRESENTACIÓN */

.hero{
  margin:18px 16px 22px;
  padding:26px 21px;
  border-radius:25px;
  background:
    linear-gradient(145deg,#153622,#0a1710);
  border:1px solid #285238;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.hero small{
  color:var(--verde);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.7px;
}

.hero h1{
  margin:8px 0 7px;
  font-size:32px;
  line-height:1.05;
}

.hero p{
  margin:0;
  color:var(--gris);
  font-size:14px;
  line-height:1.5;
}

/* FILTROS */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 16px 20px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  flex:none;
  border:1px solid var(--borde);
  background:#0c1811;
  color:white;
  padding:10px 16px;
  border-radius:30px;
  font-weight:800;
  font-size:13px;
}

.categories button.active{
  background:var(--verde);
  color:#061009;
  border-color:var(--verde);
}

/* SECCIONES */

section{
  padding:0 16px 28px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h2{
  margin:0;
  font-size:21px;
}

.section-title span{
  color:var(--gris);
  font-size:12px;
}

/* PRODUCTOS */

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  overflow:hidden;
  border-radius:19px;
  background:
    linear-gradient(160deg,#122319,#0b1710);
  border:1px solid var(--borde);
  box-shadow:0 9px 25px rgba(0,0,0,.28);
}

.photo{
  height:185px;
  padding:10px;
  background:#eeeeeb;
  display:flex;
  align-items:center;
  justify-content:center;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.info{
  padding:12px;
}

.name{
  font-size:15px;
  font-weight:900;
  line-height:1.2;
}

.available{
  margin-top:7px;
  color:var(--verde);
  font-size:11px;
  font-weight:900;
}

.add{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:11px;
  background:var(--verde);
  color:#061009;
  font-weight:900;
  font-size:12px;
}

/* BOTÓN PEDIDO */

.cart-button{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:calc(100% - 28px);
  max-width:590px;
  padding:16px;
  border:0;
  border-radius:17px;
  background:#25d366;
  color:#061009;
  font-size:16px;
  font-weight:950;
  z-index:30;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
}

/* CARRITO */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.72);
  align-items:flex-end;
}

.overlay.show{
  display:flex;
}

.cart{
  width:100%;
  max-width:620px;
  margin:auto;
  max-height:82vh;
  overflow:auto;
  padding:20px;
  background:#0b1711;
  border-radius:25px 25px 0 0;
}

.close{
  float:right;
  border:0;
  background:#1b2b22;
  color:white;
  border-radius:50%;
  padding:8px 11px;
}

.cart h2{
  margin-top:5px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #23382b;
}

.item-name{
  font-weight:900;
}

.item-category{
  color:var(--gris);
  font-size:12px;
  margin-top:3px;
}

.qty{
  margin-top:9px;
}

.qty button{
  background:#182a20;
  color:white;
  border:1px solid #304839;
  border-radius:8px;
  padding:5px 11px;
}

.whatsapp{
  width:100%;
  margin-top:16px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#25d366;
  color:#061009;
  font-size:15px;
  font-weight:900;
}

/* TABLET / PC */

@media(min-width:700px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .photo{
    height:240px;
  }

  .hero{
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
  }

  section{
    max-width:1100px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LA FAMILIA <span>CBD</span>
  </div>
</header>

<div class="hero">
  <small>CATÁLOGO DIGITAL</small>

  <h1>Parafernalia</h1>

  <p>
    Descubre nuestra selección de accesorios.
    Elige tus productos y prepara tu pedido por WhatsApp.
  </p>
</div>

<div class="categories" id="categories"></div>

<main id="products"></main>

<button class="cart-button" onclick="openCart()">
  🛒 Ver pedido (<span id="count">0</span>)
</button>

<div class="overlay" id="overlay">

  <div class="cart">

    <button class="close" onclick="closeCart()">✕</button>

    <h2>Tu pedido</h2>

    <div id="cartItems"></div>

    <button class="whatsapp" onclick="sendWhatsApp()">
      💬 PEDIR AHORA POR WHATSAPP
    </button>

  </div>

</div>

<script>

/* =========================
   WHATSAPP
========================= */

const WHATSAPP = "34600000000";


/* =========================
   PRODUCTOS
========================= */

const products = [

  {
    category:"Ceniceros de cristal",
    name:"RAW Original · Transparente",
    image:"IMG_5663.jpeg"
  },

  {
    category:"Ceniceros de plástico",
    name:"Cenicero · Amarillo",
    image:"IMG_5662.jpeg"
  },

  {
    category:"Ceniceros de plástico",
    name:"Cenicero · Verde",
    image:"IMG_5661.jpeg"
  },

  {
    category:"Ceniceros metálicos",
    name:"Cenicero · Plateado",
    image:"IMG_5660.jpeg"
  },

  {
    category:"Ceniceros de cristal",
    name:"Cenicero · Transparente",
    image:"IMG_5659.jpeg"
  },

  {
    category:"Ceniceros de cristal",
    name:"RAW Original · Rojo",
    image:"IMG_5657.jpeg"
  },

  {
    category:"Ceniceros de cristal",
    name:"RAW Original · Multicolor",
    image:"IMG_5656.jpeg"
  }

];


let selectedCategory = "Todos";

let cart = [];


/* =========================
   CATEGORÍAS
========================= */

function renderCategories(){

  const categories = [
    "Todos",
    "Ceniceros de cristal",
    "Ceniceros de plástico",
    "Ceniceros metálicos"
  ];

  document.getElementById("categories").innerHTML =
    categories.map(category => {

      let label = category;

      if(category === "Ceniceros de cristal"){
        label = "Cristal";
      }

      if(category === "Ceniceros de plástico"){
        label = "Plástico";
      }

      if(category === "Ceniceros metálicos"){
        label = "Metal";
      }

      return `
        <button
          class="${selectedCategory === category ? "active" : ""}"
          onclick="selectCategory('${category}')">
          ${label}
        </button>
      `;

    }).join("");
}


/* =========================
   SELECCIONAR CATEGORÍA
========================= */

function selectCategory(category){

  selectedCategory = category;

  renderCategories();

  renderProducts();
}


/* =========================
   PRODUCTOS
========================= */

function renderProducts(){

  const filtered =
    selectedCategory === "Todos"
      ? products
      : products.filter(
          product => product.category === selectedCategory
        );

  const categories =
    [...new Set(filtered.map(product => product.category))];

  document.getElementById("products").innerHTML =
    categories.map(category => {

      const categoryProducts =
        filtered.filter(
          product => product.category === category
        );

      return `

        <section>

          <div class="section-title">

            <h2>${category}</h2>

            <span>
              ${categoryProducts.length}
              modelos
            </span>

          </div>

          <div class="products">

            ${categoryProducts.map(product => `

              <div class="card">

                <div class="photo">

                  <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                  >

                </div>

                <div class="info">

                  <div class="name">
                    ${product.name}
                  </div>

                  <div class="available">
                    ● Disponible
                  </div>

                  <button
                    class="add"
                    onclick="addToCart('${product.category}','${product.name}')">

                    Añadir al pedido

                  </button>

                </div>

              </div>

            `).join("")}

          </div>

        </section>

      `;

    }).join("");
}


/* =========================
   CARRITO
========================= */

function addToCart(category,name){

  const existing =
    cart.find(
      item =>
        item.category === category &&
        item.name === name
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      category:category,
      name:name,
      quantity:1
    });

  }

  updateCount();

  openCart();
}


function updateCount(){

  document.getElementById("count").textContent =
    cart.reduce(
      (total,item) => total + item.quantity,
      0
    );

}


/* =========================
   ABRIR / CERRAR CARRITO
========================= */

function openCart(){

  renderCart();

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeCart(){

  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* =========================
   MOSTRAR CARRITO
========================= */

function renderCart(){

  const container =
    document.getElementById("cartItems");

  if(cart.length === 0){

    container.innerHTML =
      "<p style='color:#9eafa5'>Tu pedido está vacío.</p>";

    return;
  }


  container.innerHTML =
    cart.map((item,index) => `

      <div class="item">

        <div>

          <div class="item-name">
            ${item.name}
          </div>

          <div class="item-category">
            ${item.category}
          </div>

          <div class="qty">

            <button
              onclick="changeQuantity(${index},-1)">
              −
            </button>

            ${item.quantity}

            <button
              onclick="changeQuantity(${index},1)">
              +
            </button>

          </div>

        </div>

      </div>

    `).join("");

}


/* =========================
   CANTIDADES
========================= */

function changeQuantity(index,change){

  cart[index].quantity += change;

  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }

  updateCount();

  renderCart();

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

  if(cart.length === 0){

    alert("Tu pedido está vacío.");

    return;
  }


  let message =
    "Hola, quiero hacer un pedido:\n\n";


  cart.forEach(item => {

    message +=
      "• " +
      item.name +
      " (" +
      item.category +
      ") × " +
      item.quantity +
      "\n";

  });


  message +=
    "\nGracias 🙏";


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message);


  window.location.href = url;

}


/* =========================
   INICIAR
========================= */

renderCategories();

renderProducts();

updateCount();

</script>

</body>
</html>
