<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">

<title>La Familia CBD · Catálogo</title>

<style>
*{box-sizing:border-box}

:root{
  --g:#18d59a;
  --g2:#0da978;
  --k:#050806;
  --w:#fff;
  --mut:#6c756f;
  --line:#dfe5e1
}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:#f5f6f5;
  color:#0b0f0d;
  font-family:Arial,Helvetica,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

/* HEADER */

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,8,6,.97);
  color:#fff;
  border-bottom:1px solid #26312b;
  padding:8px 12px;
  display:grid;
  grid-template-columns:44px 1fr 88px;
  align-items:center
}

.icon{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#fff;
  font-size:23px;
  display:grid;
  place-items:center
}

.logo{
  width:74px;
  height:58px;
  object-fit:contain;
  justify-self:center
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:2px
}

.cartTop{
  position:relative
}

.badge{
  position:absolute;
  right:-1px;
  top:-1px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  background:var(--g);
  color:#03110b;
  font-size:10px;
  font-weight:900;
  display:grid;
  place-items:center
}

/* HERO */

.hero{
  min-height:480px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.1),
      rgba(0,0,0,.88)
    ),
    radial-gradient(
      circle at 75% 35%,
      #176346 0,
      #07110c 48%,
      #020403 100%
    );

  color:#fff;

  padding:70px 22px 36px;

  display:flex;
  align-items:flex-end;

  position:relative;
  overflow:hidden
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      125deg,
      transparent 0 34px,
      rgba(24,213,154,.04) 35px 36px
    )
}

.heroIn{
  position:relative;
  z-index:1
}

.kicker{
  font-size:10px;
  letter-spacing:4px;
  font-weight:900;
  color:#b9c4be;
  margin-bottom:15px
}

.hero h1{
  font-size:54px;
  line-height:.86;
  margin:0 0 18px;
  font-weight:1000;
  letter-spacing:-3px
}

.hero h1 span{
  display:block;
  color:var(--g);
  font-style:italic
}

.hero p{
  font-size:12px;
  line-height:1.5;
  color:#dce2df;
  max-width:330px;
  margin:0 0 22px
}

.cta{
  border:0;
  background:var(--g);
  color:#03120c;
  padding:14px 20px;
  border-radius:3px;
  font-size:12px;
  font-weight:1000
}

/* CONTENT */

.wrap{
  max-width:1180px;
  margin:auto;
  padding:24px 14px 110px
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:8px 0 14px
}

.sectionHead h2{
  font-size:29px;
  line-height:1;
  margin:0;
  font-weight:1000;
  letter-spacing:-1px
}

.search{
  display:flex;
  gap:8px;
  margin:0 0 18px
}

.search input{
  width:100%;
  border:1px solid #ccd5d0;
  background:#fff;
  border-radius:4px;
  padding:13px 14px;
  outline:none;
  font-size:13px
}

.search input:focus{
  border-color:var(--g2)
}

/* CATEGORIES */

.cats{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:2px 1px 9px;
  margin-bottom:24px;
  scrollbar-width:none
}

.cats::-webkit-scrollbar{
  display:none
}

.cat{
  white-space:nowrap;
  border:1px solid #cdd6d1;
  background:#fff;
  border-radius:999px;
  padding:9px 13px;
  font-size:10px;
  font-weight:1000
}

.cat.active{
  background:var(--k);
  color:#fff;
  border-color:var(--k)
}

.count{
  font-size:10px;
  color:var(--mut);
  font-weight:800
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
  overflow:hidden;
  transition:transform .18s
}

.card:active{
  transform:scale(.985)
}

.photo{
  aspect-ratio:1/1;
  background:#101512;
  overflow:hidden;
  display:grid;
  place-items:center
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.noPhoto{
  color:#8c9891;
  font-size:9px;
  letter-spacing:1px;
  font-weight:900;
  text-align:center;
  padding:15px
}

.info{
  padding:10px 9px 11px
}

.name{
  font-size:13px;
  line-height:1.12;
  font-weight:1000;
  min-height:31px
}

.available{
  font-size:10px;
  color:#13936d;
  margin:6px 0 9px;
  font-weight:900
}

.available.off{
  color:#8b3f3f
}

.priceRow{
  display:flex;
  justify-content:flex-end
}

.add{
  border:0;
  background:var(--g);
  color:#04130d;
  font-weight:1000;
  font-size:10px;
  padding:9px 11px;
  border-radius:3px
}

.add.off{
  background:#dfe4e1;
  color:#707872
}

/* FLOATING CART */

.floating{
  position:fixed;
  right:17px;
  bottom:19px;
  z-index:45;
  width:60px;
  height:60px;
  border:0;
  border-radius:50%;
  background:var(--g);
  color:#03120c;
  box-shadow:0 12px 35px rgba(0,0,0,.3);
  font-size:23px
}

.floating .badge{
  right:0;
  top:-2px
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:70;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s
}

.overlay.show{
  opacity:1;
  pointer-events:auto
}

.sheet{
  position:absolute;
  left:50%;
  bottom:0;

  transform:translate(-50%,100%);

  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;

  background:#fff;

  border-radius:18px 18px 0 0;

  transition:
    transform .28s
    cubic-bezier(.2,.8,.2,1)
}

.overlay.show .sheet{
  transform:translate(-50%,0)
}

.sheet.cartMode .productView{
  display:none
}

.sheet:not(.cartMode) .cartView{
  display:none
}

/* PRODUCT MODAL */

.productView img.heroImg{
  width:100%;
  aspect-ratio:1.1;
  object-fit:cover;
  background:#101512
}

.modalBody{
  padding:18px 16px 20px
}

.close{
  position:absolute;
  right:14px;
  top:14px;

  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.78);
  color:#fff;

  font-size:22px;
  z-index:2
}

.modalBody h3{
  font-size:25px;
  line-height:1.05;
  margin:0 0 8px
}

.stock{
  color:#13936d;
  font-size:12px;
  font-weight:900;
  margin-bottom:16px
}

.qty{
  display:flex;
  align-items:center;

  border:1px solid #ccd5d0;

  width:max-content;

  border-radius:5px;

  overflow:hidden;

  margin-bottom:14px
}

.qty button{
  width:46px;
  height:42px;
  border:0;
  background:#f0f3f1;
  font-size:20px
}

.qty span{
  width:52px;
  text-align:center;
  font-weight:1000
}

.confirm{
  width:100%;
  border:0;
  background:var(--g);
  padding:15px;
  border-radius:4px;
  font-weight:1000
}

/* CART */

.cartView{
  padding:18px 15px 20px
}

.cartHead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.cartHead h3{
  font-size:26px;
  margin:0
}

.cartLine{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:10px;
  align-items:center;

  border-bottom:1px solid #e1e6e3;

  padding:11px 0
}

.cartLine img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:4px;
  background:#111
}

.lineName{
  font-size:12px;
  font-weight:900
}

.lineCat{
  font-size:9px;
  color:#77817b;
  margin-top:3px
}

.miniQty{
  display:flex;
  border:1px solid #d3dad6;
  border-radius:4px;
  overflow:hidden
}

.miniQty button{
  border:0;
  background:#f0f3f1;
  width:27px;
  height:29px
}

.miniQty span{
  width:28px;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:900
}

.wa{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:16px;
  border-radius:4px;
  font-weight:1000;
  margin-top:8px
}

.note{
  text-align:center;
  font-size:10px;
  color:#737b77;
  margin-top:8px
}

.empty{
  grid-column:1/-1;

  border:1px dashed #bac5bf;

  padding:34px;

  text-align:center;

  color:#6d7771;

  background:#fff
}

/* CART ANIMATION */

.fly{
  position:fixed;
  z-index:100;

  width:18px;
  height:18px;

  border-radius:50%;

  background:var(--g);

  pointer-events:none;

  animation:
    fly .55s ease-in forwards
}

@keyframes fly{

  to{
    transform:
      translate(
        calc(50vw - 40px),
        calc(-50vh + 30px)
      )
      scale(.15);

    opacity:.15
  }

}

/* DESKTOP */

@media(min-width:700px){

  .hero{
    min-height:590px;
    padding-left:8vw
  }

  .hero h1{
    font-size:78px
  }

  .grid{
    grid-template-columns:
      repeat(4,1fr)
  }

  .sheet{
    bottom:18px;
    border-radius:18px
  }

}
</style>
</head>

</div>

</div>

</button>


<div

<div

<div

>
</div>

let selected="Todos";
let cart=[];
let current=null;
let query="";

const soldOut=new Set();


function safe(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  )

}


function imageHTML(p){

  if(!p.image){

    return `
      <div class="noPhoto">
        FOTO PENDIENTE
      </div>
    `;

  }

  return `
    <img
      src="${safe(p.image)}"
      alt="${safe(p.name)}"
      loading="lazy"
    >
  `;

}


function isAvailable(p){

  return !soldOut.has(p.name);

}


function renderCats(){

  const el=document.getElementById("cats");

  el.innerHTML=`

    <button
      class="cat ${selected==="Todos"?"active":""}"
      onclick="filterCat('Todos')"
    >
      TODOS
    </button>

  `+

  categories.map(c=>`

    <button
      class="cat ${selected===c?"active":""}"
      onclick='filterCat(${JSON.stringify(c)})'
    >
      ${safe(c.toUpperCase())}
    </button>

  `).join("");

}


function render(){

  renderCats();

  const list=
    products.filter(
      p=>
        (selected==="Todos" || p.category===selected)
        &&
        (
          !query ||
          p.name
            .toLowerCase()
            .includes(query.toLowerCase())
        )
    );


  document.getElementById("count")
    .textContent=
      list.length+" productos";


  document.getElementById("products")
    .innerHTML=

    list.length

    ?

    list.map(p=>{

      const av=isAvailable(p);
      const index=products.indexOf(p);

      return `

        <article
          class="card"
          onclick="openProduct(${index})"
        >

          <div class="photo">

            ${imageHTML(p)}

          </div>


          <div class="info">

            <div class="name">
              ${safe(p.name)}
            </div>


            <div
              class="available ${av?"":"off"}"
            >
              ● ${av?"Disponible":"Agotado"}
            </div>


            <div class="priceRow">

              <button
                class="add ${av?"":"off"}"
                ${av?"":"disabled"}
                onclick="
                  event.stopPropagation();
                  ${av?`quickAdd(${index})`:""}
                "
              >
                ${av?"AÑADIR":"AGOTADO"}
              </button>

            </div>

          </div>

        </article>

      `;

    }).join("")

    :

    `

      <div class="empty">
        No encontramos productos con esa búsqueda.
      </div>

    `;

}


function filterCat(c){

  selected=c;

  render();

  document
    .getElementById("catalogo")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    e=>{
      query=e.target.value;
      render();
    }
  );


function openProduct(i){

  const p=products[i];

  if(
    !p ||
    !isAvailable(p)
  ){

    return;

  }


  current={
    ...p,
    qty:1
  };


  document
    .getElementById("productView")
    .innerHTML=`

      <button
        class="close"
        onclick="closeOverlay()"
      >
        ×
      </button>

      ${
        p.image

        ?

        `
          <img
            class="heroImg"
            src="${safe(p.image)}"
            alt="${safe(p.name)}"
          >
        `

        :

        `
          <div
            class="photo"
            style="aspect-ratio:1.1"
          >
            <div class="noPhoto">
              FOTO PENDIENTE
            </div>
          </div>
        `
      }


      <div class="modalBody">

        <h3>
          ${safe(p.name)}
        </h3>


        <div class="stock">
          ● Disponible
        </div>


        <div class="qty">

          <button
            onclick="changeQty(-1)"
          >
            −
          </button>


          <span id="modalQty">
            1
          </span>


          <button
            onclick="changeQty(1)"
          >
            +
          </button>

        </div>


        <button
          class="confirm"
          onclick="confirmAdd()"
        >
          AÑADIR AL CARRITO →
        </button>

      </div>

    `;


  document
    .getElementById("sheet")
    .classList.remove("cartMode");


  document
    .getElementById("overlay")
    .classList.add("show");

}


function quickAdd(i){

  current={
    ...products[i],
    qty:1
  };

  confirmAdd();

}


function changeQty(n){

  current.qty=
    Math.max(
      1,
      current.qty+n
    );


  document
    .getElementById("modalQty")
    .textContent=
      current.qty;

}


function confirmAdd(){

  if(!current){
    return;
  }


  const ex=
    cart.find(
      x=>x.name===current.name
    );


  if(ex){

    ex.qty+=current.qty;

  }else{

    cart.push({

      name:current.name,

      category:current.category,

      image:current.image,

      qty:current.qty

    });

  }


  updateCount();

  fly();

  closeOverlay();

}


function fly(){

  const d=
    document.createElement("div");

  d.className="fly";

  d.style.left="50%";

  d.style.top="65%";

  document
    .body
    .appendChild(d);


  setTimeout(
    ()=>d.remove(),
    600
  );

}


function updateCount(){

  const n=
    cart.reduce(
      (s,x)=>s+x.qty,
      0
    );


  document
    .getElementById("topCount")
    .textContent=n;


  document
    .getElementById("floatCount")
    .textContent=n;

}


function openCart(){

  renderCart();

  document
    .getElementById("sheet")
    .classList.add("cartMode");

  document
    .getElementById("overlay")
    .classList.add("show");

}


function renderCart(){

  const total=
    cart.reduce(
      (s,x)=>s+x.qty,
      0
    );


  document
    .getElementById("cartView")
    .innerHTML=`

      <div class="cartHead">

        <h3>
          CARRITO (${total})
        </h3>


        <button
          class="icon"
          style="color:#111"
          onclick="closeOverlay()"
        >
          ×
        </button>

      </div>


      ${
        cart.length

        ?

        cart.map(
          (x,i)=>`

            <div class="cartLine">

              ${
                x.image

                ?

                `
                  <img
                    src="${safe(x.image)}"
                    alt=""
                  >
                `

                :

                `
                  <div
                    class="photo"
                    style="
                      width:58px;
                      height:58px
                    "
                  >
                    <div class="noPhoto">
                      —
                    </div>
                  </div>
                `
              }


              <div>

                <div class="lineName">
                  ${safe(x.name)}
                </div>


                <div class="lineCat">
                  ${safe(x.category)}
                </div>

              </div>


              <div class="miniQty">

                <button
                  onclick="qty(${i},-1)"
                >
                  −
                </button>


                <span>
                  ${x.qty}
                </span>


                <button
                  onclick="qty(${i},1)"
                >
                  +
                </button>

              </div>

            </div>

          `
        ).join("")

        :

        `
          <div
            class="empty"
            style="margin-top:20px"
          >
            Tu pedido está vacío.
          </div>
        `
      }


      <button
        class="wa"
        onclick="orderWhatsApp()"
        ${cart.length?"":"disabled"}
      >
        PEDIR POR WHATSAPP →
      </button>


      <div class="note">
        WhatsApp abrirá el pedido preparado
        para que lo revises y lo envíes.
      </div>

    `;

}


function qty(i,n){

  cart[i].qty+=n;


  if(
    cart[i].qty<=0
  ){

    cart.splice(i,1);

  }


  updateCount();

  renderCart();

}


function orderWhatsApp(){

  if(!cart.length){
    return;
  }


  const msg=

    "Hola, quiero hacer un pedido:\n\n"+

    cart
      .map(
        x=>
          "• "+
          x.name+
          " ("+
          x.category+
          ") × "+
          x.qty
      )
      .join("\n")+

    "\n\nGracias 🙏";


  window.location.href=

    "https://wa.me/"+
    WHATSAPP+
    "?text="+
    encodeURIComponent(msg);

}


function closeOverlay(){

  document
    .getElementById("overlay")
    .classList.remove("show");

  document
    .getElementById("sheet")
    .classList.remove("cartMode");

}


function backdrop(e){

  if(
    e.target.id==="overlay"
  ){

    closeOverlay();

  }

}


render();

updateCount();

</script>
