<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">

<title>La Familia CBD · Catálogo</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --verde:#19d69a;
  --verde2:#0fae7c;
  --negro:#070b09;
  --blanco:#ffffff;
  --gris:#68706c;
  --linea:#dfe4e1;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f6f5;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}


/* =========================
   CABECERA
========================= */

.top{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(7,11,9,.97);
  color:white;

  border-bottom:1px solid #27332d;

  padding:10px 14px;

  display:flex;
  align-items:center;
  gap:12px;
}

.icon{
  width:42px;
  height:42px;

  border:0;
  background:transparent;

  color:white;

  display:grid;
  place-items:center;

  font-size:25px;
}

.logo{
  width:78px;
  height:62px;

  margin:auto;
}

.actions{
  display:flex;
  gap:2px;
}

.cartTop{
  position:relative;
}

.badge{
  position:absolute;

  right:0;
  top:0;

  min-width:19px;
  height:19px;

  padding:0 5px;

  border-radius:20px;

  background:var(--verde);

  color:#03110b;

  font-size:11px;
  font-weight:900;

  display:grid;
  place-items:center;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:510px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12),
      rgba(0,0,0,.82)
    ),
    radial-gradient(
      circle at 75% 35%,
      #155f46 0,
      #07110c 48%,
      #020504 100%
    );

  color:white;

  position:relative;
  overflow:hidden;

  padding:65px 24px 38px;

  display:flex;
  align-items:flex-end;
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      125deg,
      transparent 0 35px,
      rgba(25,214,154,.035) 36px 37px
    );
}

.heroContent{
  position:relative;
  z-index:2;
}

.kicker{
  font-size:10px;
  letter-spacing:4px;

  font-weight:800;

  color:#b9c4be;

  margin-bottom:15px;
}

.hero h1{
  font-size:52px;
  line-height:.86;

  margin:0 0 18px;

  font-weight:1000;

  letter-spacing:-3px;
}

.hero h1 span{
  display:block;

  color:var(--verde);

  font-style:italic;
}

.hero p{
  font-size:13px;

  line-height:1.5;

  color:#dce2df;

  max-width:330px;

  margin:0 0 25px;
}

.cta{
  border:0;

  background:var(--verde);

  color:#02110b;

  border-radius:3px;

  padding:14px 21px;

  font-size:12px;

  font-weight:1000;
}


/* =========================
   CONTENIDO
========================= */

.wrap{
  max-width:1100px;

  margin:auto;

  padding:26px 16px 110px;
}

.sectionHead{
  display:flex;

  justify-content:space-between;
  align-items:end;

  margin:8px 0 15px;
}

.sectionHead h2{
  font-size:30px;
  line-height:1;

  margin:0;

  font-weight:1000;

  letter-spacing:-1px;
}

.link{
  border:0;

  background:none;

  color:var(--verde2);

  font-weight:900;

  font-size:12px;
}


/* =========================
   CATEGORÍAS
========================= */

.categories{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin-bottom:35px;
}

.cat{
  border:1px solid #cfd7d3;

  background:white;

  padding:0;

  border-radius:4px;

  overflow:hidden;

  text-align:left;
}

.catImg{
  height:92px;

  background:#111;
}

.catImg img{
  width:100%;
  height:100%;

  object-fit:cover;

  opacity:.88;
}

.catName{
  font-size:11px;

  font-weight:1000;

  padding:10px 9px;
}


/* =========================
   PRODUCTOS
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;
}

.card{
  background:white;

  border:1px solid var(--linea);

  border-radius:5px;

  overflow:hidden;

  transition:
    transform .2s;
}

.card:active{
  transform:scale(.985);
}

.photo{
  aspect-ratio:1/1;

  background:#101412;

  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.info{
  padding:11px 10px 12px;
}

.name{
  font-weight:1000;

  font-size:14px;

  line-height:1.1;

  min-height:32px;
}

.available{
  font-size:10px;

  color:#16936e;

  margin:6px 0 9px;

  font-weight:800;
}

.priceRow{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;
}

.price{
  font-size:16px;

  font-weight:1000;
}

.add{
  border:0;

  background:var(--verde);

  color:#04130d;

  font-weight:1000;

  font-size:10px;

  padding:10px 12px;

  border-radius:3px;
}

.empty{
  grid-column:1/-1;

  border:1px dashed #bfc9c4;

  padding:30px;

  text-align:center;

  color:#6d7772;
}


/* =========================
   CARRITO FLOTANTE
========================= */

.floating{
  position:fixed;

  right:18px;
  bottom:20px;

  z-index:35;

  width:60px;
  height:60px;

  border:0;

  border-radius:50%;

  background:var(--verde);

  color:#04130d;

  box-shadow:
    0 12px 35px rgba(0,0,0,.3);

  font-size:24px;
}

.floating .badge{
  right:0;
  top:-2px;
}


/* =========================
   MODALES
========================= */

.overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.62);

  z-index:60;

  opacity:0;

  pointer-events:none;

  transition:opacity .22s;
}

.overlay.show{
  opacity:1;

  pointer-events:auto;
}

.modal,
.cartPanel{
  position:absolute;

  left:50%;
  bottom:0;

  transform:
    translate(-50%,100%);

  width:min(560px,100%);

  max-height:90vh;

  overflow:auto;

  background:white;

  border-radius:
    18px 18px 0 0;

  transition:
    transform .28s
    cubic-bezier(.2,.8,.2,1);

  padding-bottom:18px;
}

.overlay.show .modal{
  transform:
    translate(-50%,0);
}

.overlay.cartMode .modal{
  transform:
    translate(-50%,100%);
}

.overlay.cartMode .cartPanel{
  transform:
    translate(-50%,0);
}


/* =========================
   PRODUCTO
========================= */

.modalImg{
  width:100%;

  aspect-ratio:1.25;

  background:#111;

  object-fit:cover;
}

.modalBody{
  padding:18px;
}

.close{
  position:absolute;

  right:16px;
  top:15px;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.75);

  color:white;

  font-size:22px;
}

.modal h3{
  font-size:25px;

  margin:0 0 7px;
}

.stock{
  color:#15936d;

  font-size:12px;

  font-weight:800;
}

.modalPrice{
  font-size:24px;

  font-weight:1000;

  margin:12px 0 18px;
}

.qtyBox{
  display:flex;

  align-items:center;

  border:1px solid #cfd7d3;

  width:max-content;

  border-radius:5px;

  overflow:hidden;

  margin-bottom:14px;
}

.qtyBox button{
  width:46px;
  height:42px;

  border:0;

  background:#f1f3f2;

  font-size:20px;
}

.qtyNum{
  width:52px;

  text-align:center;

  font-weight:1000;
}

.confirm{
  width:100%;

  border:0;

  background:var(--verde);

  padding:15px;

  border-radius:4px;

  font-weight:1000;
}


/* =========================
   CARRITO
========================= */

.cartPanel{
  padding:20px 16px;
}

.cartTitle{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.cartTitle h3{
  font-size:26px;

  margin:0;
}

.x{
  border:0;

  background:none;

  font-size:25px;
}

.cartLine{
  display:grid;

  grid-template-columns:
    58px 1fr auto;

  gap:10px;

  align-items:center;

  border-bottom:
    1px solid #e2e6e4;

  padding:12px 0;
}

.cartLine img{
  width:58px;
  height:58px;

  object-fit:cover;

  border-radius:4px;

  background:#111;
}

.lineName{
  font-size:13px;

  font-weight:900;
}

.lineCat{
  font-size:10px;

  color:#76807b;

  margin-top:3px;
}

.miniQty{
  display:flex;

  border:1px solid #d5dbd8;

  border-radius:4px;

  overflow:hidden;
}

.miniQty button{
  border:0;

  background:#f1f3f2;

  width:27px;
  height:29px;
}

.miniQty span{
  width:28px;

  display:grid;

  place-items:center;

  font-size:11px;

  font-weight:900;
}

.total{
  display:flex;

  justify-content:space-between;

  font-size:21px;

  font-weight:1000;

  margin:20px 0;
}

.wa{
  width:100%;

  border:0;

  background:#111;

  color:white;

  padding:16px;

  border-radius:4px;

  font-weight:1000;
}

.note{
  text-align:center;

  font-size:10px;

  color:#737b77;

  margin-top:8px;
}


/* =========================
   ANIMACIÓN CARRITO
========================= */

.fly{
  position:fixed;

  z-index:100;

  width:18px;
  height:18px;

  border-radius:50%;

  background:var(--verde);

  pointer-events:none;

  animation:
    fly .55s ease-in forwards;
}

@keyframes fly{

  to{
    transform:
      translate(
        calc(50vw - 40px),
        calc(-50vh + 30px)
      )
      scale(.15);

    opacity:.2;
  }

}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .hero{
    min-height:600px;

    padding-left:8vw;
  }

  .hero h1{
    font-size:76px;
  }

  .wrap{
    padding-left:30px;
    padding-right:30px;
  }

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .modal,
  .cartPanel{
    bottom:18px;

    border-radius:18px;
  }

}

</style>
</head>


<body>

     CABECERA
========================= -->

<script>


/* =========================
   WHATSAPP
========================= */

const WHATSAPP =
"34600000000";


/* =========================
   PRODUCTOS
========================= */

const products = [


{
  name:"RAW Original · Transparente",
  category:"Parafernalia",
  image:"IMG_5663.jpeg"
},


{
  name:"Cenicero · Amarillo",
  category:"Parafernalia",
  image:"IMG_5662.jpeg"
},


{
  name:"Cenicero · Verde",
  category:"Parafernalia",
  image:"IMG_5661.jpeg"
},


{
  name:"Cenicero · Plateado",
  category:"Parafernalia",
  image:"IMG_5660.jpeg"
},


{
  name:"Cenicero · Transparente",
  category:"Parafernalia",
  image:"IMG_5659.jpeg"
},


{
  name:"RAW Original · Rojo",
  category:"Parafernalia",
  image:"IMG_5657.jpeg"
},


{
  name:"RAW Original · Multicolor",
  category:"Parafernalia",
  image:"IMG_5656.jpeg"
}


];


let selected = "Todos";

let cart = [];

let current = null;



/* =========================
   MOSTRAR PRODUCTOS
========================= */

function render(){

  const list =
    selected === "Todos"
      ? products
      : products.filter(
          p => p.category === selected
        );


  const container =
    document.getElementById("products");


  if(!list.length){

    container.innerHTML = `
      <div class="empty">
        Esta categoría está preparada
        para recibir productos.
        Próximamente 🔥
      </div>
    `;

    return;

  }


  container.innerHTML =
    list.map(p => `

      <article
        class="card"
        onclick="
          openProductByName('${p.name.replace(/'/g,"\\'")}')
        "
      >

        <div class="photo">

          <img
            src="${p.image}"
            alt="${p.name}"
            loading="lazy"
          >

        </div>


        <div class="info">

          <div class="name">
            ${p.name}
          </div>


          <div class="available">
            ● Disponible
          </div>


          <div class="priceRow">

            <div class="price">
              Consultar
            </div>


            <button
              class="add"
              onclick="
                event.stopPropagation();

                openProductByName(
                  '${p.name.replace(/'/g,"\\'")}'
                )
              "
            >
              AÑADIR
            </button>

          </div>

        </div>

      </article>

    `).join("");

}



/* =========================
   FILTRAR CATEGORÍA
========================= */

function filterCat(category){

  selected = category;

  render();

  document
    .getElementById("products")
    .scrollIntoView({
      behavior:"smooth"
    });

}



/* =========================
   ABRIR PRODUCTO
========================= */

function openProductByName(name){

  const product =
    products.find(
      p => p.name === name
    );


  if(!product){
    return;
  }


  current = {
    ...product,
    qty:1
  };


  document
    .getElementById("productModal")
    .innerHTML = `

      <button
        class="close"
        onclick="closeOverlay()"
      >
        ×
      </button>


      <img
        class="modalImg"
        src="${product.image}"
        alt="${product.name}"
      >


      <div class="modalBody">

        <h3>
          ${product.name}
        </h3>


        <div class="stock">
          ● Disponible
        </div>


        <div class="modalPrice">
          Consultar
        </div>


        <div class="qtyBox">

          <button
            onclick="changeModal(-1)"
          >
            −
          </button>


          <div
            class="qtyNum"
            id="modalQty"
          >
            1
          </div>


          <button
            onclick="changeModal(1)"
          >
            +
          </button>

        </div>


        <button
          class="confirm"
          onclick="confirmAdd()"
        >
          AÑADIR AL CARRITO →
        </button>

      </div>

    `;


  document
    .getElementById("overlay")
    .classList.add("show");


  document
    .getElementById("overlay")
    .classList.remove("cartMode");

}



/* =========================
   CANTIDAD
========================= */

function changeModal(number){

  current.qty =
    Math.max(
      1,
      current.qty + number
    );


  document
    .getElementById("modalQty")
    .textContent =
      current.qty;

}



/* =========================
   AÑADIR AL CARRITO
========================= */

function confirmAdd(){

  for(
    let i = 0;
    i < current.qty;
    i++
  ){

    addItem(current);

  }


  flyToCart();

  closeOverlay();

}



/* =========================
   AÑADIR PRODUCTO
========================= */

function addItem(product){

  const existing =
    cart.find(
      item =>
        item.name === product.name
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:product.name,

      category:product.category,

      image:product.image,

      qty:1

    });

  }

}



/* =========================
   ANIMACIÓN
========================= */

function flyToCart(){

  const dot =
    document.createElement("div");


  dot.className =
    "fly";


  dot.style.left =
    "50%";


  dot.style.top =
    "65%";


  document.body.appendChild(dot);


  setTimeout(
    () => dot.remove(),
    600
  );


  updateCount();

}



/* =========================
   CONTADOR
========================= */

function updateCount(){

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  document
    .getElementById("topCount")
    .textContent =
      total;


  document
    .getElementById("floatCount")
    .textContent =
      total;

}



/* =========================
   ABRIR CARRITO
========================= */

function openCart(){

  renderCart();


  document
    .getElementById("overlay")
    .classList.add(
      "show",
      "cartMode"
    );

}



/* =========================
   MOSTRAR CARRITO
========================= */

function renderCart(){

  const panel =
    document.getElementById(
      "cartPanel"
    );


  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  panel.innerHTML = `

    <div class="cartTitle">

      <h3>
        CARRITO (${total})
      </h3>


      <button
        class="x"
        onclick="closeOverlay()"
      >
        ×
      </button>

    </div>


    ${
      cart.length

      ?

      cart.map(
        (item,index) => `

          <div class="cartLine">

            <img
              src="${item.image}"
              alt=""
            >


            <div>

              <div class="lineName">
                ${item.name}
              </div>


              <div class="lineCat">
                ${item.category}
              </div>

            </div>


            <div class="miniQty">

              <button
                onclick="
                  qty(${index},-1)
                "
              >
                −
              </button>


              <span>
                ${item.qty}
              </span>


              <button
                onclick="
                  qty(${index},1)
                "
              >
                +
              </button>

            </div>

          </div>

        `
      ).join("")

      :

      `
        <div class="empty">
          Tu pedido está vacío.
        </div>
      `

    }


    <div class="total">

      <span>
        TOTAL
      </span>


      <span>
        Consultar
      </span>

    </div>


    <button
      class="wa"
      onclick="orderWhatsApp()"
    >
      PEDIR POR WHATSAPP →
    </button>


    <div class="note">
      Se abrirá WhatsApp con tu pedido
      preparado para enviar.
    </div>

  `;

}



/* =========================
   CAMBIAR CANTIDAD CARRITO
========================= */

function qty(index,number){

  cart[index].qty += number;


  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  updateCount();

  renderCart();

}



/* =========================
   PEDIDO WHATSAPP
========================= */

function orderWhatsApp(){

  if(!cart.length){
    return;
  }


  const message =
    "Hola, quiero hacer un pedido:\n" +

    cart.map(
      item =>
        "• " +
        item.name +
        " (" +
        item.category +
        ") × " +
        item.qty
    ).join("\n") +

    "\nGracias 🙏";


  window.open(

    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message),

    "_blank"

  );

}



/* =========================
   CERRAR
========================= */

function closeOverlay(){

  document
    .getElementById("overlay")
    .classList.remove(
      "show",
      "cartMode"
    );

}


function backdrop(event){

  if(
    event.target.id ===
    "overlay"
  ){

    closeOverlay();

  }

}



/* =========================
   INICIO
========================= */

render();

updateCount();

</script>

</body>
</html>
